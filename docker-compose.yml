version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pashupati-db
    restart: always
    environment:
      POSTGRES_USER: pashupati
      POSTGRES_PASSWORD: pashupati_secret
      POSTGRES_DB: pashupati
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashupati -d pashupati"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pashupati-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://pashupati:pashupati_secret@db:5432/pashupati
      JWT_SECRET: pashupati_dev_jwt_secret_min32chars_secure_entropy_key!
      ENVIRONMENT: development
      UPLOAD_BUCKET: pashupati-media
      UPLOAD_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    container_name: pashupati-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pashupati_admin
      MINIO_ROOT_PASSWORD: pashupati_storage_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

