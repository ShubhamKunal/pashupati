name: pashupati
description: "PASHUPATI — Community-powered animal rescue platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Real-time
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.3

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Location & Device Capabilities
  geolocator: ^13.0.4
  url_launcher: ^6.3.1

  # UI, Icons, Typography & Assets
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
    - assets/mock/
