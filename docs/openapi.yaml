  /api/v1/ws:
    get:
      tags:
        - Real-time Telematics
      summary: Establish duplex WebSocket connection
      description: |
        Upgrades HTTP connection to WebSocket protocol.
        
        ### Client Messages:
        - `{"type": "SUBSCRIBE_SOS", "sos_id": "uuid"}`
        - `{"type": "UNSUBSCRIBE_SOS", "sos_id": "uuid"}`
        - `{"type": "TELEMETRY_UPDATE", "latitude": 12.978, "longitude": 77.641, "speed_kmh": 28.5, "heading": 90.0}`
        
        ### Server Messages:
        - `{"type": "TELEMETRY_BROADCAST", "session_id": "uuid", "sos_id": "uuid", "latitude": 12.978, "longitude": 77.641, "speed_kmh": 28.5, "heading": 90.0, "timestamp": "2026-11-05T15:32:00Z"}`
        - `{"type": "STATUS_CHANGED", "sos_id": "uuid", "new_status": "EN_ROUTE", "actor_id": "uuid", "timestamp": "2026-11-05T15:32:00Z"}`
      parameters:
        - name: token
          in: query
          required: false
          description: Optional JWT query param for authenticated telematics session
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket

